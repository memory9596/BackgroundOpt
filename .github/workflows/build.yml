name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: "r25b"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get base version from properties file
        id: get_base_version
        run: |
          VERSION_NAME=$(grep "VERSION_NAME=" version.properties | cut -d'=' -f2 | tr -d '\n')
          echo "BASE_VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
        
      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > app/my-release-key.keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Find APK files
        id: find_apks
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "RELEASE_APK_PATH=${RELEASE_APK}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: BackgroundOpt
          path: |
            ${{ steps.find_apks.outputs.RELEASE_APK_PATH }}
